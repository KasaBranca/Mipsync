[package]
name = "mipsync-hub"
version = "2026.9.1"
description = "Mipsync Hub - PS1 Game Engine Launcher & Hub"
authors = ["Mipsync"]
edition = "2021"
default-run = "MipsyncHub"

[[bin]]
name = "MipsyncHub"
path = "src/main.rs"

[[bin]]
name = "MipsyncHubUpdater"
path = "src/updater_main.rs"

[lib]
name = "mipsync_hub_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "5"
walkdir = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }
