<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="251" viewBox="0 0 840 251" role="img" aria-label="Mipsync">
  <!-- Preserve the original emblem and wordmark contours; recolor only the lettering for light backgrounds. -->
  <defs>
    <image id="banner" width="840" height="251" xlink:href="data:image/png;base64,"/>
    <clipPath id="emblem"><rect width="280" height="251"/></clipPath>
    <clipPath id="wordmark"><rect x="280" width="560" height="251"/></clipPath>
    <filter id="ink" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.122  0 0 0 0 0.137  0 0 0 0 0.157  0 0 0 1 0"/>
    </filter>
  </defs>
  <use xlink:href="#banner" clip-path="url(#emblem)"/>
  <use xlink:href="#banner" clip-path="url(#wordmark)" filter="url(#ink)"/>
</svg>
